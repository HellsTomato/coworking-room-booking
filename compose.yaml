services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - backend-h2-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    environment:
      # Адрес backend внутри Docker-сети для прокси Vite.
      VITE_PROXY_TARGET: http://backend:8080
      # Демонстрационный mock API: включён по умолчанию, выключается VITE_MOCK_API=false.
      VITE_MOCK_API: ${VITE_MOCK_API:-true}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-h2-data:

name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [lab-1, lab-1-backend]
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test backend in Docker
        run: docker build --tag coworking-room-booking-backend:ci backend

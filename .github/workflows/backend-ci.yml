name: Backend CI

on:
  pull_request:
  push:
    branches: [main, 'lab-*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run backend tests in Docker
        run: docker build --target test --tag coworking-room-booking-backend:test backend
      - name: Build backend image
        run: docker build --tag coworking-room-booking-backend:ci backend
